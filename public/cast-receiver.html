<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RadioSphere.be - Cast Receiver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      background-image: radial-gradient(ellipse at 20% 50%, hsla(220,90%,30%,0.3) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 50%, hsla(280,80%,30%,0.3) 0%, transparent 60%);
      color: #fff;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 32px 48px 0;
    }
    .header svg { width: 48px; height: 48px; }
    .header .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      object-fit: cover;
      filter:
        drop-shadow(0 0 10px hsla(220,90%,60%,0.65))
        drop-shadow(0 0 22px hsla(280,80%,60%,0.45));
      animation: logoGlow 3.6s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%,100% { filter: drop-shadow(0 0 8px hsla(220,90%,60%,0.55)) drop-shadow(0 0 18px hsla(280,80%,60%,0.35)); }
      50%     { filter: drop-shadow(0 0 14px hsla(220,90%,65%,0.85)) drop-shadow(0 0 28px hsla(280,80%,65%,0.6)); }
    }
    .header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, hsl(220,90%,60%), hsl(280,80%,60%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Center area */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 0 48px;
    }
    .genre-animation {
      width: 340px;
      height: 340px;
    }
    .genre-animation svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 8px hsla(220,90%,60%,0.5)) drop-shadow(0 0 24px hsla(280,80%,60%,0.3));
    }
    .station-name {
      font-family: 'Poppins', sans-serif;
      font-size: 42px;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(135deg, hsl(220,90%,60%), hsl(280,80%,60%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      max-width: 80%;
      line-height: 1.2;
    }
    .station-tags {
      font-size: 18px;
      color: hsla(0,0%,100%,0.5);
      text-align: center;
    }

    /* Bottom mini-player */
    .mini-player {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 48px;
      background: hsla(0,0%,100%,0.05);
      border-top: 1px solid hsla(0,0%,100%,0.1);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 10;
    }
    .mini-player-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: hsla(220,90%,60%,0.2);
      overflow: hidden;
      flex-shrink: 0;
    }
    .mini-player-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mini-player-info {
      flex: 1;
      min-width: 0;
    }
    .mini-player-name {
      font-weight: 600;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-player-status {
      font-size: 13px;
      color: hsla(0,0%,100%,0.4);
    }
    /* Animated equalizer bars */
    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 48px;
    }
    .eq-bar {
      width: 8px;
      border-radius: 3px;
      background: linear-gradient(to top, hsl(220,90%,60%), hsl(280,80%,60%));
    }
    .eq-bar:nth-child(1)  { animation: eq 0.50s ease-in-out infinite alternate; }
    .eq-bar:nth-child(2)  { animation: eq 0.70s ease-in-out infinite alternate; height: 32px; }
    .eq-bar:nth-child(3)  { animation: eq 0.40s ease-in-out infinite alternate; }
    .eq-bar:nth-child(4)  { animation: eq 0.60s ease-in-out infinite alternate; height: 24px; }
    .eq-bar:nth-child(5)  { animation: eq 0.55s ease-in-out infinite alternate; height: 40px; }
    .eq-bar:nth-child(6)  { animation: eq 0.45s ease-in-out infinite alternate; height: 18px; }
    .eq-bar:nth-child(7)  { animation: eq 0.65s ease-in-out infinite alternate; height: 36px; }
    .eq-bar:nth-child(8)  { animation: eq 0.38s ease-in-out infinite alternate; height: 22px; }
    .eq-bar:nth-child(9)  { animation: eq 0.72s ease-in-out infinite alternate; height: 30px; }
    .eq-bar:nth-child(10) { animation: eq 0.48s ease-in-out infinite alternate; height: 14px; }
    .eq-bar:nth-child(11) { animation: eq 0.58s ease-in-out infinite alternate; height: 38px; }
    .eq-bar:nth-child(12) { animation: eq 0.42s ease-in-out infinite alternate; height: 26px; }
    @keyframes eq {
      0%   { height: 8px; }
      100% { height: 48px; }
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 12px 48px 24px;
      font-size: 13px;
      color: hsla(0,0%,100%,0.25);
    }

    /* Mascot — peeks from bottom-right, sitting above the mini-player */
    .mascot {
      position: fixed;
      right: 28px;
      bottom: 110px;
      width: 200px;
      height: auto;
      pointer-events: none;
      z-index: 1;
      filter:
        drop-shadow(0 0 14px hsla(280,80%,60%,0.45))
        drop-shadow(0 6px 18px rgba(0,0,0,0.45));
      animation: mascotFloat 5.5s ease-in-out infinite;
      transform-origin: bottom center;
    }
    @keyframes mascotFloat {
      0%,100% { transform: translateY(0) rotate(-1.5deg); }
      50%     { transform: translateY(-8px) rotate(1.5deg); }
    }

    /* Hidden state */
    .hidden { display: none !important; }

    /* CAF requires a cast-media-player element to own the real media pipeline.
       Keep it mounted but visually hidden so RadioSphere keeps its custom TV UI. */
    cast-media-player {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
      z-index: 0;
      --background-color: transparent;
      --splash-image: none;
    }

    /* Debug overlay (visible on TV — photograph it to read) */
    #debugOverlay {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 46%;
      max-height: 92vh;
      overflow: hidden;
      background: rgba(0,0,0,0.82);
      border: 2px solid hsl(120,90%,55%);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.35;
      color: hsl(120,90%,75%);
      z-index: 9999;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #debugOverlay h2 {
      font-size: 16px;
      color: hsl(50,100%,60%);
      margin-bottom: 6px;
      font-family: 'Courier New', monospace;
    }
    #debugOverlay .err { color: hsl(0,100%,70%); font-weight: bold; }
    #debugOverlay .ok  { color: hsl(120,90%,65%); }
    #debugOverlay .k   { color: hsl(200,90%,70%); }
  </style>
</head>
<body>

  <!-- Required by the Cast Application Framework for media playback. -->
  <cast-media-player></cast-media-player>

  <!-- Debug overlay — visible on TV to diagnose playback (disable with ?debug=0) -->
  <div id="debugOverlay">
    <h2>RS DEBUG v1</h2>
    <div id="debugLog">waiting for cast…</div>
  </div>

  <!-- Mascot -->
  <img class="mascot" src="lite-hiro.png" alt="" aria-hidden="true" />

  <!-- Header -->
  <div class="header">
    <img class="brand-logo" src="RS1_HD.png" alt="RadioSphere" />
    <h1>RadioSphere.be</h1>
  </div>

  <!-- Center -->
  <div class="center">
    <div class="genre-animation" id="genreAnimContainer">
      <!-- Default: parabolic satellite dish, animated when playing -->
      <svg viewBox="-12 -8 92 92" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="dishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="hsl(220,90%,70%)"/>
            <stop offset="100%" stop-color="hsl(280,80%,70%)"/>
          </linearGradient>
          <radialGradient id="dishFace" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="hsla(0,0%,100%,0.35)"/>
            <stop offset="100%" stop-color="hsla(220,60%,40%,0.15)"/>
          </radialGradient>
        </defs>

        <!-- Mast / pedestal base -->
        <line x1="34" y1="74" x2="46" y2="74" stroke-width="3"/>
        <path d="M40,74 L40,58" stroke-width="2.5"/>
        <rect x="36" y="56" width="8" height="6" rx="1.5" stroke-width="2" fill="hsla(0,0%,100%,0.08)"/>

        <!-- Dish (parabolic ellipse, tilted slightly up-right) -->
        <g transform="rotate(-25 40 40)">
          <!-- Outer rim -->
          <ellipse cx="40" cy="40" rx="22" ry="9" stroke="url(#dishGrad)" stroke-width="2.5" fill="url(#dishFace)"/>
          <!-- Inner concentric rings (truss detail) -->
          <ellipse cx="40" cy="40" rx="16" ry="6.5" stroke-width="1" opacity="0.55"/>
          <ellipse cx="40" cy="40" rx="10" ry="4" stroke-width="1" opacity="0.45"/>
          <ellipse cx="40" cy="40" rx="4.5" ry="1.8" stroke-width="1" opacity="0.4"/>
          <!-- Radial trusses -->
          <line x1="18" y1="40" x2="62" y2="40" stroke-width="0.8" opacity="0.4"/>
          <line x1="22" y1="32" x2="58" y2="48" stroke-width="0.8" opacity="0.35"/>
          <line x1="22" y1="48" x2="58" y2="32" stroke-width="0.8" opacity="0.35"/>
          <!-- Feed horn arms -->
          <line x1="40" y1="40" x2="40" y2="22" stroke-width="1.5"/>
          <line x1="32" y1="40" x2="40" y2="22" stroke-width="1" opacity="0.6"/>
          <line x1="48" y1="40" x2="40" y2="22" stroke-width="1" opacity="0.6"/>
          <!-- Feed horn -->
          <rect x="37" y="18" width="6" height="6" rx="1" stroke-width="1.5" fill="hsla(0,0%,100%,0.2)"/>
        </g>

        <!-- Emitted radio waves — quarter-arcs centered on the feed horn (32,24),
             opening into the upper-left quadrant, aligned with the dish boresight (-25°) -->
        <g stroke="url(#dishGrad)" fill="none" stroke-linecap="round" opacity="0.95"
           transform="rotate(-25 32 24)">
          <path d="M22,24 A10,10 0 0 1 32,14" stroke-width="2.2">
            <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
            <animate attributeName="stroke-width" values="2.6;1.2" dur="1.8s" repeatCount="indefinite"/>
          </path>
          <path d="M14,24 A18,18 0 0 1 32,6" stroke-width="2">
            <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.45s" repeatCount="indefinite"/>
            <animate attributeName="stroke-width" values="2.4;1" dur="1.8s" begin="0.45s" repeatCount="indefinite"/>
          </path>
          <path d="M6,24 A26,26 0 0 1 32,-2" stroke-width="1.7">
            <animate attributeName="opacity" values="0;0.9;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
            <animate attributeName="stroke-width" values="2.2;0.8" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
          </path>
        </g>
      </svg>
    </div>
    <div class="station-name" id="stationName">En attente...</div>
    <div class="station-tags" id="stationTags"></div>
  </div>

  <!-- Mini Player -->
  <div class="mini-player">
    <div class="mini-player-icon" id="miniIcon">
      <img id="miniIconImg" src="" alt="" style="display:none">
    </div>
    <div class="mini-player-info">
      <div class="mini-player-name" id="miniName">--</div>
      <div class="mini-player-status" id="receiverStatus">En attente</div>
    </div>
    <div class="equalizer">
      <div class="eq-bar" style="height:20px"></div>
      <div class="eq-bar" style="height:32px"></div>
      <div class="eq-bar" style="height:14px"></div>
      <div class="eq-bar" style="height:24px"></div>
      <div class="eq-bar" style="height:40px"></div>
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:36px"></div>
      <div class="eq-bar" style="height:22px"></div>
      <div class="eq-bar" style="height:30px"></div>
      <div class="eq-bar" style="height:14px"></div>
      <div class="eq-bar" style="height:38px"></div>
      <div class="eq-bar" style="height:26px"></div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer" id="footerMsg">Contrôlez la lecture depuis votre téléphone</div>

  <!-- Cast Receiver SDK -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <script>
    // ─── Genre Animation SVGs (standalone, no React) ───────────────────
    const S = 'stroke-linecap="round" stroke-linejoin="round" fill="none"';
    const W = 'white';

    const GENRE_SVGS = {
      "60s": `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <circle cx="40" cy="40" r="18" stroke-width="2.5"/><line x1="40" y1="22" x2="40" y2="58" stroke-width="2"/>
        <line x1="40" y1="40" x2="27" y2="53" stroke-width="2"/><line x1="40" y1="40" x2="53" y2="53" stroke-width="2"/>
        ${[0,60,120,180,240,300].map(a=>`<ellipse cx="40" cy="14" rx="5" ry="10" stroke-width="1.5" transform="rotate(${a} 40 40)"><animate attributeName="ry" values="10;13;10" dur="${2+a*0.003}s" repeatCount="indefinite"/></ellipse>`).join('')}
      </svg>`,
      "70s": `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <circle cx="40" cy="40" r="32" stroke-width="2.5"/><circle cx="40" cy="40" r="22" stroke-width="1.5"/>
        <circle cx="40" cy="40" r="12" stroke-width="1.5"/><circle cx="40" cy="40" r="5" stroke-width="2.5"/>
        <g><animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="6s" repeatCount="indefinite"/>
        <line x1="40" y1="8" x2="40" y2="14" stroke-width="1" opacity="0.3"/></g>
      </svg>`,
      "80s": `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <polyline points="5,55 18,18 32,52 46,12 60,48 75,15" stroke-width="3"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite"/></polyline>
        <polyline points="8,68 22,32 36,62 50,22 64,58 78,28" stroke-width="2" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="1.8s" repeatCount="indefinite"/></polyline>
      </svg>`,
      "90s": `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        ${[{x:6,h:50,y:20,d:.7},{x:19,h:60,y:10,d:.5},{x:32,h:45,y:25,d:.9},{x:45,h:55,y:15,d:.6},{x:58,h:40,y:30,d:.8},{x:71,h:50,y:20,d:.55}].map(b=>
        `<rect x="${b.x}" y="${b.y}" width="8" height="${b.h}" rx="2" stroke-width="2" fill="${W}" fill-opacity="0.3">
          <animate attributeName="height" values="${b.h};${b.h*0.4};${b.h*0.9};${b.h}" dur="${b.d}s" repeatCount="indefinite"/>
          <animate attributeName="y" values="${b.y};${b.y+b.h*0.6};${b.y+b.h*0.1};${b.y}" dur="${b.d}s" repeatCount="indefinite"/>
        </rect>`).join('')}
      </svg>`,
      ambient: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        ${[10,20,30].map((r,i)=>`<circle cx="40" cy="40" r="${r}" stroke-width="2"><animate attributeName="r" values="${r};${r+4};${r}" dur="${3+i}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0.3;0.8" dur="${3+i}s" repeatCount="indefinite"/></circle>`).join('')}
      </svg>`,
      blues: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <ellipse cx="30" cy="55" rx="18" ry="16" stroke-width="2.5"/><circle cx="30" cy="55" r="5" stroke-width="1.5"/>
        <line x1="48" y1="48" x2="70" y2="10" stroke-width="3"/><rect x="66" y="6" width="10" height="8" rx="2" stroke-width="2"/>
      </svg>`,
      chillout: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <path d="M2,40 Q20,15 40,40 T78,40" stroke-width="2.5"><animate attributeName="d" values="M2,40 Q20,15 40,40 T78,40;M2,40 Q20,60 40,40 T78,40;M2,40 Q20,15 40,40 T78,40" dur="3.5s" repeatCount="indefinite"/></path>
        <path d="M2,52 Q20,28 40,52 T78,52" stroke-width="1.5" opacity="0.5"><animate attributeName="d" values="M2,52 Q20,28 40,52 T78,52;M2,52 Q20,70 40,52 T78,52;M2,52 Q20,28 40,52 T78,52" dur="4.5s" repeatCount="indefinite"/></path>
      </svg>`,
      classical: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <path d="M20,55 L20,25 C20,15 35,8 50,12 C62,15 68,25 68,35 L68,55 C68,58 65,60 62,60 L26,60 C23,60 20,58 20,55Z" stroke-width="2.5"/>
        <rect x="22" y="54" width="44" height="5" rx="1" stroke-width="1.5"/>
        <g><circle cx="14" cy="20" r="2.5" stroke-width="1.5"><animate attributeName="cy" values="22;14;22" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle></g>
      </svg>`,
      country: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <g><animateTransform attributeName="transform" type="rotate" values="-3 40 44;3 40 44;-3 40 44" dur="3s" repeatCount="indefinite"/>
        <path d="M2,52 Q14,60 40,56 Q66,60 78,52 Q66,48 40,50 Q14,48 2,52Z" stroke-width="2.5"/>
        <path d="M18,50 L22,26 Q28,16 40,18 Q52,16 58,26 L62,50" stroke-width="2.5"/>
        <path d="M22,26 Q31,36 40,33 Q49,36 58,26" stroke-width="2"/></g>
      </svg>`,
      electronic: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <polyline points="5,40 20,40 25,15 35,65 45,25 55,55 60,40 75,40" stroke-width="2.5"><animate attributeName="stroke-dashoffset" values="200;0" dur="2s" repeatCount="indefinite"/></polyline>
        <circle cx="40" cy="40" r="5" stroke-width="2.5"><animate attributeName="r" values="4;9;4" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
      </svg>`,
      funk: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <path d="M5,40 C12,20 20,60 30,30 C40,55 50,15 60,45 C65,55 70,25 78,40" stroke-width="3">
          <animate attributeName="d" values="M5,40 C12,20 20,60 30,30 C40,55 50,15 60,45 C65,55 70,25 78,40;M5,40 C12,55 20,20 30,50 C40,25 50,60 60,30 C65,20 70,55 78,40;M5,40 C12,20 20,60 30,30 C40,55 50,15 60,45 C65,55 70,25 78,40" dur="1.5s" repeatCount="indefinite"/></path>
      </svg>`,
      hiphop: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <rect x="30" y="10" width="20" height="32" rx="10" stroke-width="2.5"/>
        <line x1="40" y1="42" x2="40" y2="60" stroke-width="2.5"/><line x1="28" y1="60" x2="52" y2="60" stroke-width="2.5"/>
        ${[16,22,28].map((r,i)=>`<path d="M${40-r},30 A${r},${r} 0 0,0 ${40+r},30" stroke-width="1.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="${1.2+i*0.3}s" repeatCount="indefinite"/></path>`).join('')}
      </svg>`,
      jazz: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <path d="M22,8 L28,8 L30,14" stroke-width="2.5"/><path d="M30,14 L32,28" stroke-width="2.5"/>
        <path d="M32,28 C32,34 34,40 38,46 C42,52 46,56 46,62 C46,68 42,72 36,72 C30,72 26,68 26,62" stroke-width="3"/>
        <circle cx="34" cy="34" r="2" stroke-width="1.5"/><circle cx="36" cy="42" r="2" stroke-width="1.5"/><circle cx="40" cy="50" r="2" stroke-width="1.5"/>
        <g><ellipse cx="58" cy="20" rx="3" ry="2.5" stroke-width="1.5"><animate attributeName="cy" values="22;12;22" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></ellipse></g>
      </svg>`,
      latin: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <g><animateTransform attributeName="transform" type="rotate" values="-8 30 50;8 30 50;-8 30 50" dur="0.5s" repeatCount="indefinite"/>
        <ellipse cx="30" cy="22" rx="12" ry="16" stroke-width="2.5"/><line x1="30" y1="38" x2="30" y2="68" stroke-width="2.5"/></g>
        <g><animateTransform attributeName="transform" type="rotate" values="8 55 50;-8 55 50;8 55 50" dur="0.5s" repeatCount="indefinite"/>

      soul: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <path d="M40,8 C46,22 62,32 58,52 C55,64 30,68 26,54 C24,44 34,44 37,50 C40,42 28,28 40,8Z" stroke-width="2.5">
          <animate attributeName="d" values="M40,8 C46,22 62,32 58,52 C55,64 30,68 26,54 C24,44 34,44 37,50 C40,42 28,28 40,8Z;M40,10 C50,20 60,36 55,52 C52,65 32,65 28,54 C26,45 36,46 38,52 C42,40 30,26 40,10Z;M40,8 C46,22 62,32 58,52 C55,64 30,68 26,54 C24,44 34,44 37,50 C40,42 28,28 40,8Z" dur="2.5s" repeatCount="indefinite"/></path>
      </svg>`,
      techno: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <polyline points="5,40 5,20 15,20 15,60 25,60 25,20 35,20 35,60 45,60 45,20 55,20 55,60 65,60 65,20 75,20 75,40" stroke-width="2.5">

      trance: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <path d="M40,40 C40,30 50,25 55,35 C60,45 50,55 40,50 C30,45 25,35 35,25 C45,15 60,20 62,38 C64,56 48,65 35,58 C22,51 18,32 30,20" stroke-width="2.5">
          <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="8s" repeatCount="indefinite"/></path>

        <circle cx="40" cy="40" r="28" stroke-width="2.5"/><ellipse cx="40" cy="40" rx="12" ry="28" stroke-width="1.5"/>
        <line x1="12" y1="30" x2="68" y2="30" stroke-width="1.5" opacity="0.5"/>

        <g><animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="20s" repeatCount="indefinite"/>
        <circle cx="40" cy="12" r="2" fill="${W}" opacity="0.6"/></g>
      </svg>`
    };

    const GENRE_KEYWORDS = Object.keys(GENRE_SVGS);

    function detectGenre(tags) {
      if (!tags || !Array.isArray(tags)) return null;
      const joined = tags.join(' ').toLowerCase();
      for (const g of GENRE_KEYWORDS) {
        if (joined.includes(g)) return g;
      }
      // Extended matching
      const map = {
        'hip hop': 'hiphop', 'hip-hop': 'hiphop', 'rap': 'hiphop',
        'rnb': 'r&b', 'rhythm': 'r&b',
        'classic': 'classical', 'orchestra': 'classical', 'symphony': 'classical',
        'chill': 'chillout', 'lounge': 'chillout', 'relax': 'ambient',
        'edm': 'electronic', 'house': 'electronic', 'dance': 'electronic',
        'hard rock': 'rock', 'alternative': 'rock', 'indie': 'rock',
        'death': 'metal', 'heavy': 'metal', 'punk': 'rock',
        'salsa': 'latin', 'cumbia': 'latin', 'merengue': 'latin', 'bachata': 'latin',
        'dub': 'reggae', 'ska': 'reggae',
        'gospel': 'soul', 'motown': 'soul',
        'disco': 'funk',
        'information': 'news', 'talk': 'news', 'sport': 'news',
        'psytrance': 'trance', 'progressive': 'trance',
        'minimal': 'techno', 'industrial': 'techno'
      };
      for (const [key, val] of Object.entries(map)) {
        if (joined.includes(key)) return val;
      }
      return null;
    }

    function setGenreAnimation(genre) {
      const container = document.getElementById('genreAnimContainer');
      if (genre && GENRE_SVGS[genre]) {
        container.innerHTML = GENRE_SVGS[genre];
      }
      // else keep default radio waves
    }

    function normalizeTags(rawTags) {
      if (Array.isArray(rawTags)) {
        return rawTags.map(tag => String(tag).trim()).filter(Boolean);
      }
      if (typeof rawTags === 'string') {
        return rawTags.split(/[,;|•]/).map(tag => tag.trim()).filter(Boolean);
      }
      return [];
    }

    // ─── TV Debug overlay logger ────────────────────────────────────────
    // Debug overlay is opt-in: append ?debug=1 to the receiver URL to enable it.
    const debugEnabled = /[?&]debug=1/.test(location.search);
    const debugLogEl = document.getElementById('debugLog');
    const debugOverlay = document.getElementById('debugOverlay');
    if (!debugEnabled && debugOverlay) debugOverlay.style.display = 'none';
    const debugLines = [];
    function tvLog(kind, label, data) {
      if (!debugEnabled) return;
      const ts = new Date().toISOString().slice(11,19);
      let line = `[${ts}] `;
      if (kind === 'err') line = `<span class="err">[${ts}] ✗ ${label}</span>`;
      else if (kind === 'ok') line = `<span class="ok">[${ts}] ✓ ${label}</span>`;
      else line = `[${ts}] <span class="k">${label}</span>`;
      if (data !== undefined) {
        let s;
        try { s = typeof data === 'string' ? data : JSON.stringify(data); }
        catch { s = String(data); }
        if (s && s.length > 280) s = s.slice(0,280) + '…';
        if (s) line += ' ' + s;
      }
      debugLines.push(line);
      if (debugLines.length > 40) debugLines.shift();
      if (debugLogEl) debugLogEl.innerHTML = debugLines.join('<br>');
    }
    window.addEventListener('error', e => tvLog('err', 'JS error', e.message));
    window.addEventListener('unhandledrejection', e => tvLog('err', 'Promise rejection', String(e.reason)));
    tvLog('ok', 'Receiver loaded');

    // ─── Cast Receiver Setup ───────────────────────────────────────────
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();
    const statusEl = document.getElementById('receiverStatus');

    function setReceiverStatus(status) {
      if (statusEl) statusEl.textContent = status;
      console.log('[RS Receiver] Status:', status);
    }

    function addReceiverEvent(eventName, handler) {
      const eventType = cast.framework.events.EventType[eventName];
      if (eventType) playerManager.addEventListener(eventType, handler);
    }

    // Error listener for diagnostics
    playerManager.addEventListener(
      cast.framework.events.EventType.ERROR,
      (event) => {
        console.error('[RS Receiver] Playback error:', JSON.stringify(event));
        setReceiverStatus('Erreur de lecture');
        tvLog('err', `ERROR ${event?.detailedErrorCode || ''} / ${event?.error?.code || ''}`,
          { type: event?.type, reason: event?.reason, detailed: event?.detailedErrorCode, err: event?.error });
      }
    );

    addReceiverEvent('BUFFERING', (e) => { setReceiverStatus('Chargement du flux'); tvLog('info', 'BUFFERING', e?.isBuffering); });
    addReceiverEvent('PLAYING', () => { setReceiverStatus('En lecture'); tvLog('ok', 'PLAYING'); });
    addReceiverEvent('PAUSE', () => tvLog('info', 'PAUSE'));
    addReceiverEvent('PLAYER_LOAD_COMPLETE', () => { setReceiverStatus('Flux chargé'); tvLog('ok', 'PLAYER_LOAD_COMPLETE'); });
    addReceiverEvent('PLAYER_LOADING', () => tvLog('info', 'PLAYER_LOADING'));
    addReceiverEvent('MEDIA_STATUS', event => {
      const state = event?.mediaStatus?.playerState;
      if (state) {
        console.log('[RS Receiver] Media status:', state, JSON.stringify(event.mediaStatus));
        tvLog('info', 'MEDIA_STATUS', state);
      }
    });

    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      request => new Promise((resolve) => {
        try {
          const media = request.media;
          if (media) {
            const streamUrl = media.contentUrl || media.contentId || media.entity || '';
            const url = streamUrl.toLowerCase();
            let ct = (media.contentType || '').toLowerCase();

            // CAF refuse les MIME wildcard ou vides (errorCode 905 LOAD_FAILED).
            if (!ct || ct === 'audio/*' || ct.endsWith('/*')) {
              const u = url.split('?')[0];
              let guessed = 'audio/mpeg';
              if (u.endsWith('.aac')) guessed = 'audio/aac';
              else if (u.endsWith('.m4a')) guessed = 'audio/mp4';
              else if (u.endsWith('.ogg') || u.endsWith('.oga') || u.endsWith('.opus')) guessed = 'audio/ogg';
              else if (u.endsWith('.flac')) guessed = 'audio/flac';
              else if (u.endsWith('.wav')) guessed = 'audio/wav';
              else if (u.endsWith('.m3u8')) guessed = 'application/x-mpegurl';
              else if (u.endsWith('.mpd')) guessed = 'application/dash+xml';
              media.contentType = guessed;
              ct = guessed;
              tvLog('ok', 'MIME forcé →', guessed);
            }

            media.streamType = cast.framework.messages.StreamType.LIVE;
            media.contentUrl = streamUrl;
            media.contentId = streamUrl;
            if (media.duration == null) media.duration = -1;

            // Force playback to start immediately after LOAD
            if (request.autoplay !== false) request.autoplay = true;

            setReceiverStatus('Chargement du flux');
            tvLog('ok', 'LOAD url', streamUrl);
            tvLog('info', 'contentType', media.contentType || '(none)');
            tvLog('info', 'streamType', media.streamType);
            if (streamUrl.startsWith('http://')) tvLog('err', 'HTTP non-sécurisé (mixed content)');

            try {
              const title = media.metadata?.title || 'Station';
              const imageUrl = media.metadata?.images?.[0]?.url || '';
              const tags = normalizeTags(media.customData?.tags);

              document.getElementById('stationName').textContent = title;
              document.getElementById('miniName').textContent = title;

              const tagsEl = document.getElementById('stationTags');
              tagsEl.textContent = tags.length > 0 ? tags.slice(0, 4).join(' • ') : '';

              const iconImg = document.getElementById('miniIconImg');
              if (imageUrl) {
                iconImg.src = imageUrl.replace('http://', 'https://');
                iconImg.style.display = 'block';
                iconImg.onerror = () => { iconImg.style.display = 'none'; };
              } else {
                iconImg.style.display = 'none';
              }

              const genre = detectGenre(tags);
              setGenreAnimation(genre);
            } catch (uiError) {
              console.warn('[RS Receiver] UI update failed; continuing media LOAD:', uiError);
              tvLog('err', 'UI update failed', String(uiError));
            }
          }
        } catch (err) {
          tvLog('err', 'LOAD interceptor error', String(err));
        }
        resolve(request);
      })
    );

    // Start receiver with PlaybackConfig optimized for live audio streams.
    const playbackConfig = new cast.framework.PlaybackConfig();
    playbackConfig.autoResumeDuration = 5;
    playbackConfig.initialBandwidth = 128000;
    context.start({ playbackConfig });
  </script>
