<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast Sphere - Cast Receiver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      background-image: radial-gradient(ellipse at 20% 50%, hsla(220,90%,30%,0.3) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 50%, hsla(280,80%,30%,0.3) 0%, transparent 60%);
      color: #fff;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 32px 48px 0;
    }
    .header svg { width: 48px; height: 48px; }
    .header .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      object-fit: cover;
      filter:
        drop-shadow(0 0 10px hsla(220,90%,60%,0.65))
        drop-shadow(0 0 22px hsla(280,80%,60%,0.45));
      animation: logoGlow 3.6s ease-in-out infinite;
    }
    @keyframes logoGlow {
      0%,100% { filter: drop-shadow(0 0 8px hsla(220,90%,60%,0.55)) drop-shadow(0 0 18px hsla(280,80%,60%,0.35)); }
      50%     { filter: drop-shadow(0 0 14px hsla(220,90%,65%,0.85)) drop-shadow(0 0 28px hsla(280,80%,65%,0.6)); }
    }
    .header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, hsl(220,90%,60%), hsl(280,80%,60%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Center area */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 0 48px;
    }
    .genre-animation {
      width: 340px;
      height: 340px;
    }
    .genre-animation svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 8px hsla(220,90%,60%,0.5)) drop-shadow(0 0 24px hsla(280,80%,60%,0.3));
    }
    .station-name {
      font-family: 'Poppins', sans-serif;
      font-size: 42px;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(135deg, hsl(220,90%,60%), hsl(280,80%,60%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      max-width: 80%;
      line-height: 1.2;
    }
    .station-tags {
      font-size: 18px;
      color: hsla(0,0%,100%,0.5);
      text-align: center;
    }

    /* Bottom mini-player */
    .mini-player {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 48px;
      background: hsla(0,0%,100%,0.05);
      border-top: 1px solid hsla(0,0%,100%,0.1);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 10;
    }
    .mini-player-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: hsla(220,90%,60%,0.2);
      overflow: hidden;
      flex-shrink: 0;
    }
    .mini-player-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mini-player-info {
      flex: 1;
      min-width: 0;
    }
    .mini-player-name {
      font-weight: 600;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-player-status {
      font-size: 13px;
      color: hsla(0,0%,100%,0.4);
    }
    /* Animated equalizer bars */
    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 48px;
    }
    .eq-bar {
      width: 8px;
      border-radius: 3px;
      background: linear-gradient(to top, hsl(220,90%,60%), hsl(280,80%,60%));
    }
    .eq-bar:nth-child(1)  { animation: eq 0.50s ease-in-out infinite alternate; }
    .eq-bar:nth-child(2)  { animation: eq 0.70s ease-in-out infinite alternate; height: 32px; }
    .eq-bar:nth-child(3)  { animation: eq 0.40s ease-in-out infinite alternate; }
    .eq-bar:nth-child(4)  { animation: eq 0.60s ease-in-out infinite alternate; height: 24px; }
    .eq-bar:nth-child(5)  { animation: eq 0.55s ease-in-out infinite alternate; height: 40px; }
    .eq-bar:nth-child(6)  { animation: eq 0.45s ease-in-out infinite alternate; height: 18px; }
    .eq-bar:nth-child(7)  { animation: eq 0.65s ease-in-out infinite alternate; height: 36px; }
    .eq-bar:nth-child(8)  { animation: eq 0.38s ease-in-out infinite alternate; height: 22px; }
    .eq-bar:nth-child(9)  { animation: eq 0.72s ease-in-out infinite alternate; height: 30px; }
    .eq-bar:nth-child(10) { animation: eq 0.48s ease-in-out infinite alternate; height: 14px; }
    .eq-bar:nth-child(11) { animation: eq 0.58s ease-in-out infinite alternate; height: 38px; }
    .eq-bar:nth-child(12) { animation: eq 0.42s ease-in-out infinite alternate; height: 26px; }
    @keyframes eq {
      0%   { height: 8px; }
      100% { height: 48px; }
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 12px 48px 24px;
      font-size: 13px;
      color: hsla(0,0%,100%,0.25);
    }

    /* Mascot — peeks from bottom-right, sitting above the mini-player */
    .mascot {
      position: fixed;
      right: 28px;
      bottom: 110px;
      width: 200px;
      height: auto;
      pointer-events: none;
      z-index: 1;
      filter:
        drop-shadow(0 0 14px hsla(280,80%,60%,0.45))
        drop-shadow(0 6px 18px rgba(0,0,0,0.45));
      animation: mascotFloat 5.5s ease-in-out infinite;
      transform-origin: bottom center;
    }
    @keyframes mascotFloat {
      0%,100% { transform: translateY(0) rotate(-1.5deg); }
      50%     { transform: translateY(-8px) rotate(1.5deg); }
    }

    /* Hidden state */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Mascot -->
  <img class="mascot" src="shiba-mascot.png" alt="" aria-hidden="true" />

  <!-- Header -->
  <div class="header">
    <img class="brand-logo" src="PS_HD.png" alt="Podcast Sphere" onerror="this.style.display='none'"/>
    <h1>Podcast Sphere</h1>
  </div>

  <!-- Center -->
  <div class="center">
    <div class="genre-animation" id="genreAnimContainer">
      <!-- Default Podcast Mic animation -->
      <svg viewBox="0 0 80 80" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- Haut du micro animé (monte et descend doucement) -->
        <g>
          <animateTransform 
            attributeName="transform" 
            type="translate" 
            values="0,2; 0,-2; 0,2" 
            dur="3.5s" 
            calcMode="spline" 
            keyTimes="0; 0.5; 1" 
            keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" 
            repeatCount="indefinite" />
          
          <rect x="30" y="16" width="20" height="32" rx="10" stroke-width="2.5"/>
          <path d="M26,24 A18,18 0 0,1 54,24" stroke-width="2" opacity="0.3">
            <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite"/>
          </path>
          <path d="M18,32 A28,28 0 0,1 62,32" stroke-width="2" opacity="0.3">
            <animate attributeName="opacity" values="0;0.6;0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
          </path>
        </g>

        <!-- Réceptacle et pied fixes -->
        <path d="M20,40 v4 a20,20 0 0,0 40,0 v-4" stroke-width="2.5"/>
        <line x1="40" y1="64" x2="40" y2="74" stroke-width="2.5"/>
        <line x1="28" y1="74" x2="52" y2="74" stroke-width="2.5"/>
      </svg>
    </div>
    <div class="station-name" id="stationName">En attente de l'épisode...</div>
    <div class="station-tags" id="stationTags"></div>
  </div>

  <!-- Mini Player -->
  <div class="mini-player">
    <div class="mini-player-icon" id="miniIcon">
      <img id="miniIconImg" src="" alt="" style="display:none">
    </div>
    <div class="mini-player-info">
      <div class="mini-player-name" id="miniName">--</div>
      <div class="mini-player-status">En lecture</div>
    </div>
    <div class="equalizer">
      <div class="eq-bar" style="height:20px"></div>
      <div class="eq-bar" style="height:32px"></div>
      <div class="eq-bar" style="height:14px"></div>
      <div class="eq-bar" style="height:24px"></div>
      <div class="eq-bar" style="height:40px"></div>
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:36px"></div>
      <div class="eq-bar" style="height:22px"></div>
      <div class="eq-bar" style="height:30px"></div>
      <div class="eq-bar" style="height:14px"></div>
      <div class="eq-bar" style="height:38px"></div>
      <div class="eq-bar" style="height:26px"></div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer" id="footerMsg">Contrôlez la lecture depuis votre téléphone</div>

  <!-- Cast Receiver SDK -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <script>
    const S = 'stroke-linecap="round" stroke-linejoin="round" fill="none"';
    const W = 'white';

    const GENRE_SVGS = {
      horror: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <path d="M20,40 Q40,15 60,40 Q40,65 20,40" stroke-width="2.5"/>
        <circle cx="40" cy="40" r="8" stroke-width="2.5"/>
        <circle cx="40" cy="40" r="3" fill="${W}">
          <animate attributeName="cx" values="38;42;38" dur="4s" repeatCount="indefinite"/>
        </circle>
        <path d="M40,55 v10" stroke-width="2.5"><animate attributeName="d" values="M40,55 v2; M40,55 v12; M40,55 v2" dur="3s" repeatCount="indefinite"/></path>
        <path d="M30,50 v8" stroke-width="2.5"><animate attributeName="d" values="M30,50 v0; M30,50 v8; M30,50 v0" dur="2.5s" repeatCount="indefinite"/></path>
      </svg>`,
      comedy: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <circle cx="40" cy="40" r="26" stroke-width="2.5"/>
        <path d="M28,32 Q32,28 36,32" stroke-width="2.5"/>
        <path d="M44,32 Q48,28 52,32" stroke-width="2.5"/>
        <path d="M25,48 Q40,65 55,48" stroke-width="2.5">
           <animate attributeName="d" values="M25,48 Q40,65 55,48; M25,44 Q40,56 55,44; M25,48 Q40,65 55,48" dur="2.5s" repeatCount="indefinite"/>
        </path>
      </svg>`,
      crime: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <circle cx="34" cy="34" r="16" stroke-width="2.5"/>
        <line x1="46" y1="46" x2="64" y2="64" stroke-width="3"/>
        <path d="M26,34 a8,8 0 0,1 16,0" stroke-width="1.5" opacity="0.5">
          <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2s" repeatCount="indefinite"/>
        </path>
      </svg>`,
      technology: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <rect x="25" y="25" width="30" height="30" rx="4" stroke-width="2.5"/>
        <circle cx="40" cy="40" r="6" stroke-width="2.5"/>
        <line x1="40" y1="25" x2="40" y2="15" stroke-width="2.5"/>
        <line x1="40" y1="55" x2="40" y2="65" stroke-width="2.5"/>
        <line x1="25" y1="40" x2="15" y2="40" stroke-width="2.5"/>
        <line x1="55" y1="40" x2="65" y2="40" stroke-width="2.5"/>
        <g opacity="0.5"><animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="8s" repeatCount="indefinite"/>
          <circle cx="40" cy="15" r="2" fill="${W}"/>
          <circle cx="40" cy="65" r="2" fill="${W}"/>
        </g>
      </svg>`,
      news: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <rect x="15" y="20" width="50" height="40" rx="4" stroke-width="2.5"/>
        <line x1="25" y1="35" x2="55" y2="35" stroke-width="2.5"/>
        <line x1="25" y1="45" x2="45" y2="45" stroke-width="2.5"/>
        <circle cx="50" cy="50" r="8" stroke-width="1.5" fill="#0a0a1a"/>
        <path d="M46,50 L50,46 L54,54 L58,48" stroke-width="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></path>
      </svg>`,
      storytelling: `<svg viewBox="0 0 80 80" fill="none" stroke="${W}" ${S}>
        <path d="M20,60 L20,20 Q40,15 60,20 L60,60 Q40,55 20,60Z" stroke-width="2.5"/>
        <line x1="40" y1="18" x2="40" y2="58" stroke-width="2.5"/>
        <path d="M25,30 L35,30 M25,40 L35,40" stroke-width="1.5"/>
        <path d="M45,30 L55,30 M45,40 L55,40" stroke-width="1.5"/>
        <path d="M60,60 Q70,55 70,25" stroke-width="1.5" opacity="0.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/></path>
      </svg>`
    };

    const GENRE_KEYWORDS = Object.keys(GENRE_SVGS);

    function detectGenre(tags) {
      if (!tags || !Array.isArray(tags)) return null;
      const joined = tags.join(' ').toLowerCase();
      
      // Extended podcast matching
      const map = {
        'horreur': 'horror', 'frissons': 'horror', 'scary': 'horror',
        'humour': 'comedy', 'comédie': 'comedy', 'fun': 'comedy',
        'crime': 'crime', 'enquête': 'crime', 'investigation': 'crime', 'meurtre': 'crime',
        'tech': 'technology', 'science': 'technology', 'web': 'technology',
        'actu': 'news', 'politique': 'news', 'société': 'news', 'journal': 'news',
        'histoire': 'storytelling', 'fiction': 'storytelling', 'récit': 'storytelling', 'culture': 'storytelling'
      };
      
      for (const [key, val] of Object.entries(map)) {
        if (joined.includes(key)) return val;
      }
      
      for (const g of GENRE_KEYWORDS) {
        if (joined.includes(g)) return g;
      }
      
      return null;
    }

    function setGenreAnimation(genre) {
      const container = document.getElementById('genreAnimContainer');
      if (genre && GENRE_SVGS[genre]) {
        container.innerHTML = GENRE_SVGS[genre];
      }
      // Si aucun genre ne matche, l'animation par défaut (micro) reste en place
    }

    // ─── Cast Receiver Setup ───────────────────────────────────────────
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    playerManager.addEventListener(
      cast.framework.events.EventType.ERROR,
      (event) => {
        console.error('[PS Receiver] Playback error:', JSON.stringify(event));
      }
    );

    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      request => {
        const media = request.media;
        if (media) {
          console.log('[PS Receiver] Loading stream:', media.contentId);

          const title = media.metadata?.title || 'Épisode';
          const imageUrl = media.metadata?.images?.[0]?.url || '';
          const tags = media.customData?.tags || [];

          // Update UI
          document.getElementById('stationName').textContent = title;
          document.getElementById('miniName').textContent = title;

          const tagsEl = document.getElementById('stationTags');
          if (tags.length > 0) {
            tagsEl.textContent = tags.slice(0, 4).join(' • ');
          } else {
            tagsEl.textContent = '';
          }

          const iconImg = document.getElementById('miniIconImg');
          if (imageUrl) {
            iconImg.src = imageUrl.replace('http://', 'https://');
            iconImg.style.display = 'block';
            iconImg.onerror = () => { iconImg.style.display = 'none'; };
          } else {
            iconImg.style.display = 'none';
          }

          const genre = detectGenre(tags);
          setGenreAnimation(genre);
        }
        return request;
      }
    );

    const playbackConfig = new cast.framework.PlaybackConfig();
    playbackConfig.autoResumeDuration = 5;
    playbackConfig.initialBandwidth = 128000;
    context.start({ playbackConfig });
  </script>
</body>
</html>
