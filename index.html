    <!-- WebView hard redirect to /lite.html: served BEFORE anything else.
         A user opening a RadioSphere link inside Facebook/Instagram/TikTok/etc.
         must never see a white screen or hit React hydration. The full app is
         still reachable via ?full=1 (CTA in lite, manual paste in real browser).
         Bots, server-side renders, and explicit /lite paths are excluded. -->
    <script>
      (function () {
        try {
          if (typeof navigator === "undefined" || typeof location === "undefined") return;
          var ua = navigator.userAgent || "";
          var inAppRx = /FBAN|FBAV|FB_IAB|FB4A|FBIOS|FBSV|FBDV|FBMD|Messenger|MessengerLite|Instagram|Threads|Barcelona|Line\/|MicroMessenger|Twitter|TikTok|musical_ly|BytedanceWebview|Snapchat|Pinterest|LinkedInApp|KAKAOTALK|NAVER|WhatsApp|GSA\/|Reddit/i;
          var isInApp = inAppRx.test(ua);
          window.__rsIsInAppBrowser = isInApp;
          if (!isInApp) return;
          var path = location.pathname || "/";
          var bypass = location.search.indexOf("full=1") !== -1 || /(^|[#&])full(=|&|$)/.test(location.hash);
          if (!bypass && path.indexOf("/lite") !== 0) {
            location.replace("/lite.html" + (location.search || "") + (location.hash || ""));
            return; // halt execution: page is being replaced
          }
          // 1. Unregister any previously installed Service Workers
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { try { r.unregister(); } catch (e) {} });
            }).catch(function () {});
          }
          // 2. Wipe all Cache Storage entries (poisoned chunks)
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { try { caches.delete(k); } catch (e) {} });
            }).catch(function () {});
          }
        } catch (e) { /* never block the page */ }
      })();
    </script>

    <script>
      // Cast SDK bridge — captures early availability before React mounts.
      // Skip entirely in in-app browsers: Cast is unsupported there and the
      // SDK adds noise/latency that makes Facebook WebViews feel broken.
      window.__castSdkReady = false;
      window['__onGCastApiAvailable'] = function(isAvailable) {
        console.log('[RadioSphere][Cast] Bridge: SDK available =', isAvailable);
        if (isAvailable) {
          window.__castSdkReady = true;
          window.dispatchEvent(new Event('castSdkReady'));
        }
      };
      (function () {
        if (window.__rsIsInAppBrowser) return;
        var s = document.createElement('script');
        s.src = 'https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';
        s.async = true;
        document.head.appendChild(s);
      })();
    </script>
